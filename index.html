<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NC Grade 5 Science Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: field-notebook — graph-paper ground, strand rail on the left, topic workspace with four tabs on the right */
:root{
  --bg:#f3f5f1; --grid:#e3e8e2; --surface:#ffffff; --surface-2:#eef1ec;
  --ink:#1b2830; --muted:#566670; --line:#d4dbd5;
  --phys:#b4521b; --life:#2c7a4b; --earth:#1f5f9e; --ok:#1f7a45; --bad:#b3261e;
  --ok-bg:#e3f3e8; --bad-bg:#fbe7e5;
  --display:"Bricolage Grotesque",ui-rounded,"Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --grid:#1c2429; --surface:#1b2328; --surface-2:#222c32;
  --ink:#e6ece8; --muted:#9db0b8; --line:#2f3b42;
  --phys:#f0935a; --life:#6cc893; --earth:#79b2ec; --ok:#6cc893; --bad:#f2867d;
  --ok-bg:#1d3527; --bad-bg:#3a2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --grid:#1c2429; --surface:#1b2328; --surface-2:#222c32;
  --ink:#e6ece8; --muted:#9db0b8; --line:#2f3b42;
  --phys:#f0935a; --life:#6cc893; --earth:#79b2ec; --ok:#6cc893; --bad:#f2867d;
  --ok-bg:#1d3527; --bad-bg:#3a2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.toplinks{display:flex;gap:8px;flex-wrap:wrap}
.toplinks a{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px}
.toplinks a:hover{border-color:var(--muted)}
.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
nav.rail{display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){nav.rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.strand{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:820px){.strand{flex:0 0 auto}}
.strand h3{margin:0;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.tbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:200px}
.tbtn .code{grid-row:span 2;font:500 12px var(--mono);color:var(--c);border:1.5px solid var(--c);border-radius:6px;padding:3px 6px;white-space:nowrap}
.tbtn .nm{font-weight:700;line-height:1.2}
.tbtn .ds{font-size:13px;color:var(--muted);line-height:1.2}
.tbtn:hover{border-color:var(--c)}
.tbtn:focus-visible,.tab:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--c,var(--earth));outline-offset:2px}
.tbtn[aria-current="true"]{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
main.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.phead{padding:22px 24px 0;border-top:6px solid var(--c)}
.eyebrow{font:500 13px var(--mono);color:var(--c);letter-spacing:.04em}
.phead h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,34px);margin:4px 0 6px;line-height:1.1;text-wrap:balance}
.phead p.big{margin:0 0 16px;color:var(--muted);max-width:65ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.tab .n{font:500 12px var(--mono);margin-left:6px;color:var(--muted)}
.pbody{padding:22px 24px 28px}
.stdlist{display:flex;flex-direction:column;gap:14px}
.std{display:grid;grid-template-columns:110px 1fr;gap:4px 16px;padding:14px 0;border-bottom:1px dashed var(--line)}
.std:last-child{border-bottom:0}
@media (max-width:560px){.std{grid-template-columns:1fr}}
.std .code{font:500 14px var(--mono);color:var(--c)}
.std .txt{font-weight:700;max-width:65ch}
.std .focus{grid-column:2;color:var(--muted);font-size:15px;max-width:65ch}
@media (max-width:560px){.std .focus{grid-column:1}}
.std.main .txt{font-family:var(--display);font-size:20px;font-weight:600}
.vocab{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.vocab span{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:15px}
.label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.act{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.act h4{margin:0;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.k{border-color:var(--c);color:var(--c)}
.act .mat{font-size:15px;color:var(--muted)}
.act ol{margin:0;padding-left:20px;font-size:15.5px}
.act ol li{margin:2px 0}
.act .ask{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:15px}
.act .ask b{color:var(--c)}
.supbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:15px}
.suptext{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;font:14px/1.5 var(--mono);margin:0 0 16px;max-height:320px;overflow:auto}
.res{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.res summary{cursor:pointer;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.res summary span{font:500 12px var(--mono);color:var(--muted)}
.mtab{width:100%;border-collapse:collapse;margin:8px 0 2px}
.mtab td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.mtab td:first-child{width:92px;padding-right:10px;font:500 13px var(--mono);color:var(--c);font-variant-numeric:tabular-nums}
.res ul{margin:2px 0;padding-left:18px}
.res p{margin:2px 0}
.res a{color:var(--c)}
.rh{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.rh.warn{color:var(--bad)}
.gpick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.gpick button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;background:var(--surface)}
.gpick button[aria-pressed="true"]{border-color:var(--c);background:var(--surface-2);color:var(--ink)}
.game{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--surface-2)}
.ghead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.ghead h4{margin:0;font-family:var(--display);font-size:24px;font-weight:800}
.ghead .how{color:var(--muted);font-size:15px;flex-basis:100%}
.score{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:22px;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.2;margin-bottom:16px;text-wrap:balance}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin,.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:17px;min-height:56px;display:flex;align-items:center;justify-content:center}
.bin:hover:not([disabled]),.opt:hover:not([disabled]){border-color:var(--c)}
.opt{justify-content:flex-start;text-align:left}
.opts{display:grid;gap:10px}
.right{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.wrong{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{all:unset;cursor:pointer;background:var(--c);color:var(--surface);font-weight:700;padding:10px 18px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.q{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.6vw,26px);line-height:1.25;margin:0 0 16px;text-wrap:balance}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px;align-items:center}
.seq .slot{font-weight:700;background:var(--surface-2);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.seq .slot b{font:500 13px var(--mono);color:var(--c)}
.seq .hint{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{all:unset;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
.pool button:hover{border-color:var(--c)}
.done{text-align:center;padding:10px}
.done .big{font-family:var(--display);font-weight:800;font-size:44px;color:var(--c);font-variant-numeric:tabular-nums}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);min-width:0}
.vid:hover{border-color:var(--c)}
.vid .src{font:500 12px var(--mono);color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.vid .t{font-weight:700;font-size:17px;line-height:1.3}
.vid .w{font-size:14.5px;color:var(--muted)}
.vid .go{font-size:14px;margin-top:auto;color:var(--muted)}
.note{color:var(--muted);font-size:14.5px;margin-top:16px;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
.card{animation:pop .18s ease-out}
</style>

<script>
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const PBS = q => "https://www.pbslearningmedia.org/search/?q=" + encodeURIComponent(q);

const TOPICS = [
{ id:"ps-5-1", strand:"Physical Science", c:"--phys", code:"PS.5.1", name:"Matter & Energy", short:"Mixing, heating, weighing",
  std:"Understand the interactions of matter and energy and the changes that occur.",
  objs:[
    ["PS.5.1.1","Carry out investigations to compare the weight of objects before and after an interaction.","When nothing can escape (a sealed bag), the total weight stays the same, even after a reaction makes gas."],
    ["PS.5.1.2","Carry out investigations to explain whether the mixing of two or more substances results in new substances.","Evidence of a new substance: gas bubbles, color change, a new solid, heat or light. Dissolving and mixing alone do not make new substances."],
    ["PS.5.1.3","Carry out investigations to compare how heating and cooling affect some materials and how this relates to their purpose and practical applications.","Different materials melt, freeze, expand, or conduct heat differently, which is why pans are metal and handles are plastic or wood."]],
  vocab:["matter","mass","weight","mixture","solution","dissolve","physical change","chemical change","conductor","insulator","melting point"],
  acts:[
    {t:"Sealed Bag Reaction", obj:"PS.5.1.1", time:"30 min", mat:"Zip bags, baking soda, vinegar, small cup, kitchen scale",
     steps:["Put 1 spoon of baking soda in a bag. Set a small cup of vinegar inside without spilling.","Seal the bag and record the weight.","Tip the cup to mix. Watch the bag puff up.","Weigh again. Then repeat in an open cup and compare."],
     ask:"Why did the open cup lose weight but the sealed bag did not?"},
    {t:"Mix Lab Stations", obj:"PS.5.1.2", time:"40 min", mat:"Salt, sand, sugar, water, milk, vinegar, baking soda, cups",
     steps:["Set up 5 stations: salt + water, sand + water, sugar + water, milk + vinegar, baking soda + vinegar.","At each station students predict, mix, and look for bubbles, color change, or a new solid.","Record on a T-chart: New substance / No new substance."],
     ask:"What evidence convinced you a new substance formed?"},
    {t:"Melt Race", obj:"PS.5.1.3", time:"25 min", mat:"Ice, butter, chocolate chip, crayon piece, foil cupcake liners, warm water or sunny window",
     steps:["Place each item in a liner on a tray of warm water or in the sun.","Time how long each takes to melt.","Rank the materials and connect to real uses (crayons in hot cars, chocolate in summer)."],
     ask:"Which material would make the best candle? Why?"},
    {t:"Ice Cube Keeper Challenge", obj:"PS.5.1.3", time:"45 min", mat:"Ice cubes, foil, felt, cotton, paper, plastic wrap, cups",
     steps:["Teams design a holder to keep an ice cube frozen as long as possible.","Test for 30 minutes and measure the leftover water.","Discuss which materials are insulators and which are conductors."],
     ask:"How is your design like a cooler or a winter coat?"}],
  games:[
    {type:"sort", title:"New Substance or Not?", how:"Read each change. Did it make a new substance?",
     bins:["New substance","No new substance"],
     items:[["Iron bike chain rusting",0],["Baking soda + vinegar fizzing",0],["Burning a log",0],["Baking cake batter",0],["Frying an egg",0],["Milk + vinegar forming clumps",0],["Salt dissolving in water",1],["Ice cube melting",1],["Cutting paper into strips",1],["Mixing trail mix",1],["Sugar stirred into tea",1],["Sand mixed with pebbles",1]]},
    {type:"quiz", title:"Weigh It Out", how:"Use what you know about weight before and after an interaction.",
     qs:[
      ["A sealed bag holds 40 g of vinegar and 10 g of baking soda. They react. What does the sealed bag weigh now (not counting the bag)?",["50 g","40 g","Less than 50 g because gas is light","More than 50 g because the bag puffed up"],0,"Nothing escaped, so the total weight is still 40 + 10 = 50 g."],
      ["The same reaction happens in an open cup. Why does the cup weigh less afterward?",["The gas escaped into the air","The vinegar disappeared","Bubbles weigh less than nothing","The scale broke"],0,"The reaction made a gas. In an open cup the gas floats away, taking its weight with it."],
      ["A 200 g ice cube melts in a sealed jar. How much does the water weigh?",["200 g","Less, because water is lighter","More, because water is heavier","It depends on the jar"],0,"Melting is a physical change. The amount of matter stays the same."],
      ["Why are many cooking pots made of metal?",["Metal conducts heat well","Metal is a good insulator","Metal melts easily","Metal is light"],0,"Metal moves heat quickly to the food. That's why handles are made of insulators like wood or plastic."],
      ["Which is the best evidence that a NEW substance formed?",["A gas bubbled out when two liquids mixed","Sugar disappeared in water","Water froze","A rock was broken in half"],0,"Unexpected gas, color change, or a new solid are signs of a chemical change."]]},
    {type:"quiz", title:"Material Match", how:"Pick the material that fits the job.",
     qs:[
      ["Best material for a spoon you'll stir hot soup with?",["Wood","Thin metal","Chocolate","Ice"],0,"Wood is an insulator, so the heat won't travel up to your hand."],
      ["Which melts at the LOWEST temperature?",["Butter","Iron","Glass","Stone"],0,"Butter melts in a warm kitchen. The others need very high heat."],
      ["Why are sidewalks built with small gaps between slabs?",["Concrete expands when heated","To let ants through","To save concrete","For decoration"],0,"Heat makes materials expand. Gaps keep slabs from cracking on hot days."],
      ["A winter coat is filled with feathers because feathers are…",["Good insulators","Good conductors","Heavy","Waterproof metals"],0,"Insulators slow down heat leaving your body."]]}],
  vids:[
    ["YouTube","Physical vs. chemical changes", "Kid-friendly explainers comparing the two kinds of change.", YT("physical and chemical changes for kids grade 5")],
    ["YouTube","Conservation of mass for kids","Sealed-bag demos showing weight stays the same.", YT("conservation of mass for kids baking soda vinegar sealed bag")],
    ["YouTube","Mixtures and solutions","How dissolving differs from making a new substance.", YT("mixtures and solutions for kids science")],
    ["YouTube","Conductors and insulators of heat","Why some materials get hot fast and others don't.", YT("thermal conductors and insulators for kids")],
    ["PBS LearningMedia","Properties of matter (grades 3–5)","Free classroom-ready clips; filter to grade 5.", PBS("properties of matter chemical change")]]},

{ id:"ps-5-2", strand:"Physical Science", c:"--phys", code:"PS.5.2", name:"Force & Motion", short:"Gravity, friction, speed",
  std:"Understand force, motion, and the relationship between them.",
  objs:[
    ["PS.5.2.1","Carry out investigations to explain how factors such as gravity, friction, and change in mass affect the motion of objects.","Gravity pulls objects toward Earth; friction slows moving objects; more mass needs more force to start, stop, or change motion."],
    ["PS.5.2.2","Use mathematics and computational thinking to infer the motion of an object (including position, direction, and speed).","Speed = distance ÷ time. Students use tables and graphs to describe where an object is, which way it's going, and how fast."]],
  vocab:["force","motion","gravity","friction","mass","speed","distance","position","direction","balanced force","unbalanced force"],
  acts:[
    {t:"Ramp Surfaces Test", obj:"PS.5.2.1", time:"40 min", mat:"Books, cardboard ramp, toy car, tape measure, carpet square, foil, sandpaper",
     steps:["Build a ramp at a fixed height.","Release the car (don't push) onto each surface.","Measure stopping distance 3 times and average.","Graph the results by surface."],
     ask:"Which surface had the most friction? How do you know?"},
    {t:"Add the Mass", obj:"PS.5.2.1", time:"30 min", mat:"Toy car, pennies, tape, rubber-band launcher or same ramp",
     steps:["Launch the empty car and measure how far it goes.","Tape on 5, then 10, then 15 pennies.","Launch with the same force each time and record distance."],
     ask:"What happens to motion when mass increases but the force stays the same?"},
    {t:"Hallway Speed Trials", obj:"PS.5.2.2", time:"35 min", mat:"Meter tape, stopwatches, masking tape, clipboards",
     steps:["Mark start and finish 10 m apart.","Students walk, tiptoe, hop, and speed-walk while partners time.","Calculate speed = distance ÷ time for each trial.","Plot position vs. time on a class chart."],
     ask:"Whose line is steepest on the graph? What does that tell you?"},
    {t:"Parachute Drop", obj:"PS.5.2.1", time:"40 min", mat:"Coffee filters, plastic bags, string, washers, stopwatch",
     steps:["Drop a washer alone and time its fall.","Attach parachutes of different sizes.","Compare fall times and discuss gravity vs. air resistance (a type of friction)."],
     ask:"Gravity didn't change. Why did the fall time change?"}],
  games:[
    {type:"speed", title:"Speed Calculator", how:"Speed = distance ÷ time. Ten random problems, new every round."},
    {type:"sort", title:"Which Force?", how:"Which force is mostly at work?",
     bins:["Gravity","Friction"],
     items:[["An apple falls from a tree",0],["A skydiver drops from a plane",0],["Rain falls to the ground",0],["A ball rolls back down a hill",0],["Brakes stop a bike",1],["Sneakers grip the gym floor",1],["A sled slows down on grass",1],["Rubbing hands makes them warm",1],["A book slides and stops on a table",1],["A diver drops into the pool",0]]},
    {type:"quiz", title:"Motion Detective", how:"Use evidence to explain motion.",
     qs:[
      ["You kick an empty box and a box full of books with the same force. Which moves farther?",["The empty box","The full box","They move the same","Neither moves"],0,"Less mass means the same force causes a bigger change in motion."],
      ["A car moves 0 m, 20 m, 40 m, 60 m at seconds 0, 1, 2, 3. What is its speed?",["20 m per second","60 m per second","3 m per second","40 m per second"],0,"It goes 20 more meters every second."],

const TABS = [["standards","Standards"],["activities","Activities"],["games","Games"],["videos","Videos"]];
let cur = TOPICS[0], tab = "standards", gi = 0, G = null;
const $ = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function renderRail(){
  const rail = document.getElementById("rail"); rail.innerHTML="";
  ["Physical Science","Life Science","Earth Science"].forEach(s=>{
    const g = $(`<div class="strand"><h3>${s}</h3></div>`);
    TOPICS.filter(t=>t.strand===s).forEach(t=>{
      const b = $(`<button class="tbtn" style="--c:var(${t.c})" aria-current="${t===cur}"><span class="code">${t.code}</span><span class="nm">${t.name}</span><span class="ds">${t.short}</span></button>`);
      b.onclick=()=>{ location.hash=t.id; };
      g.appendChild(b);
    });
    rail.appendChild(g);
  });
}

function renderPanel(){
  const p = document.getElementById("panel");
  p.style.setProperty("--c", `var(${cur.c})`);
  const counts = {standards:cur.objs.length, activities:cur.acts.length, games:cur.games.length, videos:cur.vids.length};
  p.innerHTML = `<div class="phead"><div class="eyebrow">${cur.strand} · ${cur.code}</div><h2>${cur.name}</h2><p class="big">${esc(cur.std)}</p>
    <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-k="${k}" aria-selected="${tab===k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}</div></div>
    <div class="pbody" id="pbody"></div>`;
  p.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.k; try{localStorage.setItem("sci5tab",tab)}catch(e){} renderPanel();});
  const body = document.getElementById("pbody");
  if(tab==="standards") body.innerHTML = standardsHTML();
  if(tab==="activities") body.innerHTML = activitiesHTML();
  if(tab==="videos") body.innerHTML = videosHTML();
  if(tab==="games") renderGames(body);
}

  return `<div class="stdlist">

  </div>
  <div class="label">Key vocabulary</div>
  <div class="vocab">${cur.vocab.map(v=>`<span>${v}</span>`).join("")}</div>
  <p class="note">Objective text is from NCDPI's 2023 Grade 5 Science standards; "…" marks where the official wording continues. Lines in gray are teacher-friendly summaries. Check the NCDPI unpacking document for full wording and clarifications.</p>`;
}

function resHTML(a){
  const r=RES[a.t]; if(!r) return `<div class="mat"><b>Materials:</b> ${esc(a.mat)}</div>`;
  return `<details class="res" open><summary>Resources needed <span>${esc(r.g)}</span></summary>
    <table class="mtab"><tbody>${r.m.map(x=>{const [q,i]=x.split("|");return `<tr><td>${esc(q)}</td><td>${esc(i)}</td></tr>`}).join("")}</tbody></table>
    ${r.p&&r.p.length?`<div class="rh">Printables</div><ul>${r.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${r.t&&r.t.length?`<div class="rh">Links</div><ul>${r.t.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])} ↗</a></li>`).join("")}</ul>`:""}
    <div class="rh">Prep</div><p>${esc(r.prep)}</p>
    ${r.safe&&r.safe!=="None special."?`<div class="rh warn">Safety</div><p>${esc(r.safe)}</p>`:""}
  </details>`;
}
function supplyText(){
  return `${cur.code} ${cur.name} – Supply list\n\n` + cur.acts.map(a=>{const r=RES[a.t]; if(!r) return `${a.t}\n- ${a.mat}`;
    return `${a.t} (${r.g})\n${r.m.map(x=>{const [q,i]=x.split("|");return `- ${q==="—"?"":q+" "}${i}`}).join("\n")}${r.p?"\nPrintables:\n"+r.p.map(x=>"- "+x).join("\n"):""}`}).join("\n\n");
}
function activitiesHTML(){
  return `<div class="supbar"><span>${cur.acts.length} activities · resources listed on each card</span><button class="btn ghost" id="copysup">Copy full supply list</button></div>
  <pre class="suptext" id="suptext" hidden></pre>
  <div class="acts">${cur.acts.map(a=>`<article class="act">
    <div class="chips"><span class="chip k">${a.obj}</span><span class="chip">${a.time}</span></div>
    <h4>${a.t}</h4>
    ${resHTML(a)}
    <div class="rh">Steps</div>
    <ol>${a.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <div class="ask"><b>Ask:</b> ${esc(a.ask)}</div></article>`).join("")}</div>`;
}
document.addEventListener("click",e=>{
  if(e.target.id!=="copysup") return;
  const txt=supplyText(), pre=document.getElementById("suptext"), b=e.target;
  const show=()=>{pre.textContent=txt;pre.hidden=false;const s=getSelection(),r=document.createRange();r.selectNodeContents(pre);s.removeAllRanges();s.addRange(r);b.textContent="Selected below – press Ctrl+C";};
  try{ navigator.clipboard.writeText(txt).then(()=>{b.textContent="Copied!";setTimeout(()=>b.textContent="Copy full supply list",2000);},show); }catch(err){ show(); }
});
function videosHTML(){

  <p class="note">Preview any video before showing it to students. YouTube and PBS links open a targeted search so you can pick the clip that fits your class and your district's filters.</p>`;

/* ---------- Games ---------- */
function renderGames(body){
  body.innerHTML = `<div class="gpick">${cur.games.map((g,i)=>`<button data-i="${i}" aria-pressed="${i===gi}">${g.title}</button>`).join("")}</div><div class="game" id="game"></div>`;
  body.querySelectorAll(".gpick button").forEach(b=>b.onclick=()=>{gi=+b.dataset.i; G=null; renderGames(body);});
  const g = cur.games[gi];
  if(!G) G = initGame(g);
  drawGame(g);
}
function initGame(g){
  if(g.type==="sort") return {items:shuffle(g.items), i:0, score:0, answered:null};
  if(g.type==="quiz") return {qs:shuffle(g.qs).map(q=>({q:q[0], opts:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))), why:q[3]})), i:0, score:0, answered:null};
  if(g.type==="speed") return {qs:Array.from({length:10},makeSpeed), i:0, score:0, answered:null};
  if(g.type==="order") return {pool:shuffle(g.items), picked:[], checked:false, tries:0};
}
function makeSpeed(){
  const who=[["cheetah","m","seconds"],["turtle","m","minutes"],["school bus","km","hours"],["cyclist","km","hours"],["snail","cm","minutes"],["runner","m","seconds"],["train","km","hours"],["paper airplane","m","seconds"]];
  const [n,u,t]=who[Math.floor(Math.random()*who.length)];
  const s=[2,3,4,5,6,8,10,12,15,20,25,30][Math.floor(Math.random()*12)];
  const time=[2,3,4,5,6,8,10][Math.floor(Math.random()*7)];
  const d=s*time, unit=`${u} per ${t.replace(/s$/,"")}`;
  const wrong=new Set(); [d, d*time, s+time, s*2, s+5, d-time].forEach(w=>{if(w>0&&w!==s)wrong.add(w)});
  const opts=shuffle([{t:`${s} ${unit}`,ok:true},...[...wrong].slice(0,3).map(w=>({t:`${w} ${unit}`,ok:false}))]);
  return {q:`A ${n} travels ${d} ${u} in ${time} ${t}. What is its speed?`, opts, why:`Speed = distance ÷ time = ${d} ÷ ${time} = ${s} ${unit}.`};
}
function head(g,done,total,score){
  return `<div class="ghead"><h4>${g.title}</h4>${score!=null?`<span class="score">Score ${score} / ${total}</span>`:""}<span class="how">${esc(g.how)}</span></div>
  <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>`;
}
function finish(el,score,total){
  const pct=score/total, msg=pct===1?"Perfect score!":pct>=.8?"Great work!":pct>=.6?"Good effort. Try again to beat it.":"Keep practicing. Play again!";
  el.innerHTML += `<div class="done"><div class="big">${score} / ${total}</div><p>${msg}</p><button class="btn" id="again">Play again</button></div>`;
  el.querySelector("#again").onclick=()=>{G=null; renderPanel();};
}
function drawGame(g){
  const el=document.getElementById("game");
  if(g.type==="sort"){
    const total=G.items.length;
    el.innerHTML=head(g,G.i,total,G.score);
    if(G.i>=total) return finish(el,G.score,total);
    const [txt,ans]=G.items[G.i];
    el.innerHTML+=`<div class="card">${esc(txt)}</div><div class="bins">${g.bins.map((b,k)=>`<button class="bin" data-k="${k}" ${G.answered!=null?"disabled":""}>${b}</button>`).join("")}</div>`;
    if(G.answered!=null){
      const bins=el.querySelectorAll(".bin"); bins[ans].classList.add("right"); if(G.answered!==ans) bins[G.answered].classList.add("wrong");
      el.innerHTML+=`<div class="fb ${G.answered===ans?"ok":"no"}">${G.answered===ans?"Correct!":"Not quite."} <b>${esc(txt)}</b> → ${g.bins[ans]}</div><div class="row"><button class="btn" id="next">${G.i+1<total?"Next card":"See score"}</button></div>`;
      el.querySelector("#next").onclick=()=>{G.i++;G.answered=null;drawGame(g);};
    } else el.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{G.answered=+b.dataset.k; if(G.answered===ans)G.score++; drawGame(g);});
  }
  if(g.type==="quiz"||g.type==="speed"){
    const total=G.qs.length;
    el.innerHTML=head(g,G.i,total,G.score);
    if(G.i>=total) return finish(el,G.score,total);
    const q=G.qs[G.i];
    el.innerHTML+=`<p class="q">${esc(q.q)}</p><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" ${G.answered!=null?"disabled":""}>${String.fromCharCode(65+k)}.&nbsp; ${esc(o.t)}</button>`).join("")}</div>`;
    if(G.answered!=null){
      const os=el.querySelectorAll(".opt"); q.opts.forEach((o,k)=>{if(o.ok)os[k].classList.add("right")}); const ok=q.opts[G.answered].ok; if(!ok)os[G.answered].classList.add("wrong");
      el.innerHTML+=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct!":"Not quite."}</b> ${esc(q.why)}</div><div class="row"><button class="btn" id="next">${G.i+1<total?"Next question":"See score"}</button></div>`;
      el.querySelector("#next").onclick=()=>{G.i++;G.answered=null;drawGame(g);};
    } else el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{G.answered=+b.dataset.k; if(q.opts[G.answered].ok)G.score++; drawGame(g);});
  }
  if(g.type==="order"){
    const n=g.items.length;
    el.innerHTML=head(g,G.picked.length,n,null);
    const correct = G.checked && G.picked.every((x,k)=>x===g.items[k]);
    el.innerHTML+=`<div class="seq">${G.picked.length?G.picked.map((x,k)=>`<span class="slot ${G.checked?(x===g.items[k]?"right":"wrong"):""}"><b>${k+1}</b>${esc(x)}</span>`).join(""):`<span class="hint">Tap the cards below in order…</span>`}</div>
      <div class="pool">${G.pool.filter(x=>!G.picked.includes(x)).map(x=>`<button data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
    if(G.checked){
      el.innerHTML+= correct
        ? `<div class="fb ok"><b>Correct order!</b> ${G.tries===1?"First try.":`Solved in ${G.tries} tries.`}</div>`
        : `<div class="fb no"><b>Some steps are out of place.</b> Green ones are right. Reset and try again.</div>`;
    }
    el.innerHTML+=`<div class="row">${G.picked.length===n&&!G.checked?`<button class="btn" id="chk">Check order</button>`:""}<button class="btn ghost" id="rst">${correct?"Play again":"Reset"}</button>${G.picked.length&&!G.checked?`<button class="btn ghost" id="undo">Undo</button>`:""}</div>`;
    if(!G.checked) el.querySelectorAll(".pool button").forEach(b=>b.onclick=()=>{G.picked.push(b.dataset.x);drawGame(g);});
    const chk=el.querySelector("#chk"); if(chk) chk.onclick=()=>{G.checked=true;G.tries++;drawGame(g);};
    const u=el.querySelector("#undo"); if(u) u.onclick=()=>{G.picked.pop();drawGame(g);};
    el.querySelector("#rst").onclick=()=>{ if(correct){G=initGame(g);} else {G.picked=[];G.checked=false;G.pool=shuffle(g.items);} drawGame(g);};
  }
}

}
